services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: verify
      POSTGRES_PASSWORD: verify
      POSTGRES_DB: verify
    ports:
      - "5434:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  # Local S3-compatible server for storage tests: never real AWS. API on http://localhost:9100.
  s3mock:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: eu-central-1
    ports:
      - "9100:9090"

volumes:
  dbdata:
